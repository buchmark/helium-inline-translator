<!DOCTYPE html>
<html lang="pt-BR">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helium Inline Translator</title>
  <link rel="stylesheet" href="popup.css">
  <script src="i18n.js"></script>
</head>
<body class="light">
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <img src="../icons/icon48.png" alt="" />
        </div>
        <span data-i18n="popup.title">Helium Inline Translator</span>
      </div>
      <button class="theme-toggle" id="themeToggle">🌙</button>
    </div>

    <p class="tagline" data-i18n="popup.description">
      Traduza sem popups e de forma limpa páginas ou textos selecionados por atalhos rápidos.
    </p>

    <div class="section">
      <div class="section-label" data-i18n="popup.selectLanguage">Idioma de Tradução</div>
      <div class="language-selector">
        <button class="selected-language" id="selectedLang">
          <div class="left-content">
            <span class="flag" id="langFlag">BR</span>
            <span id="langName">Português (Brasil)</span>
          </div>
          <span>▼</span>
        </button>
        <div class="dropdown" id="dropdown">
          <input type="text" class="search-box" id="searchBox" placeholder="Pesquisar..." data-i18n-placeholder="popup.search">
          <div class="dropdown-section" id="favoritesSection">
            <div class="dropdown-title" data-i18n="popup.favorites">Favoritos</div>
            <div id="favoritesList"></div>
          </div>
          <div class="dropdown-section">
            <div class="dropdown-title" data-i18n="popup.allLanguages">Todos os Idiomas</div>
            <div id="allLanguages"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-label" data-i18n="popup.shortcutsSection">Atalhos de Tradução</div>
      <div class="shortcuts-grid">
        <div class="shortcut-display">
          <span class="shortcut-icon">⌨️</span>
          <div class="shortcut-info">
            <div class="shortcut-label" data-i18n="popup.shortcutSelection">Traduzir seleção</div>
            <div class="shortcut-keys">Shift + Alt + Q</div>
          </div>
        </div>
        <div class="shortcut-display">
          <span class="shortcut-icon">🌐</span>
          <div class="shortcut-info">
            <div class="shortcut-label" data-i18n="popup.shortcutPage">Traduzir página</div>
            <div class="shortcut-keys">Shift + Alt + W</div>
          </div>
        </div>
      </div>
      <div class="revert-tip" data-i18n="popup.revertTip">Pressione novamente para reverter.</div>
    </div>

    <div class="footer">
      <span class="footer-link">v1.0.0</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
